# Estándar Lefthook — Fase 1 (formato/lint/secrets) en pre-commit, Fase 2/3 en pre-push.
# Requiere: bun, betterleaks, osv-scanner.
# Bootstrap: brew install betterleaks osv-scanner && bunx lefthook install

pre-commit:
  parallel: false
  commands:
    format-js:
      glob: "*.{js,ts,jsx,tsx,astro,mjs,cjs}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint-js:
      glob: "*.{js,ts,jsx,tsx,astro,mjs,cjs}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    secrets:
      glob: "*.{js,ts,jsx,tsx,astro,py,mjs,cjs,json,jsonc,yaml,yml,toml,md,sh}"
      run: betterleaks dir {staged_files}

pre-push:
  parallel: true
  commands:
    deps-audit:
      run: osv-scanner scan source -r .
      skip:
        - run: test ! -x "$(command -v osv-scanner)"
    typecheck:
      run: bunx astro check
      skip:
        - run: test ! -f astro.config.mjs
    test:
      run: bunx vitest run --coverage
      skip:
        - run: test ! -f vitest.config.ts
