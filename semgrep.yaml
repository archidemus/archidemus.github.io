# Estándar Semgrep — reglas locales (funcionan sin login).
# Para OWASP Top 10 completo: uvx semgrep scan --config p/owasp-top-ten --oss-only .
# Ejecución local: uvx semgrep scan --config semgrep.yaml --error .
rules:
  # ── JavaScript / TypeScript ─────────────────────────────────────────────
  - id: js.dom-xss
    languages: [javascript, typescript]
    severity: ERROR
    message: innerHTML/outerHTML con datos no confiables es DOM XSS. Usa textContent o escapa.
    metadata:
      cwe: ["CWE-79"]
    patterns:
      - pattern-either:
          - pattern: $ELEM.innerHTML = $X
          - pattern: $ELEM.insertAdjacentHTML(..., $X)
          - pattern: $ELEM.outerHTML = $X
      - pattern-not: $ELEM.innerHTML = "..."
      - pattern-not: $ELEM.outerHTML = "..."

  - id: js.eval
    languages: [javascript, typescript]
    severity: WARNING
    message: eval con datos no confiables es code injection.
    metadata:
      cwe: ["CWE-95"]
    patterns:
      - pattern: eval($X)

  - id: js.child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: exec/execSync con interpolación es command injection. Usa execFile o spawn con array.
    metadata:
      cwe: ["CWE-78"]
    patterns:
      - pattern-either:
          - pattern: child_process.exec($X)
          - pattern: child_process.execSync($X)
          - pattern: require("child_process").exec($X)
          - pattern: require("child_process").execSync($X)

  - id: js.shell-command-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: Comando shell construido por concatenación. Usa execFile/spawn con argumentos separados.
    metadata:
      cwe: ["CWE-78"]
    patterns:
      - pattern-either:
          - pattern: $EXEC(`...${$X}...`)
          - pattern: $EXEC("..." + $X)
          - pattern: $EXEC($X + "...")
      - metavariable-regex:
          metavariable: $EXEC
          regex: exec|execSync|spawn|spawnSync

  - id: js.jwt-none-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: Algoritmo JWT 'none' invalida la verificación de firma.
    metadata:
      cwe: ["CWE-347"]
    patterns:
      - pattern: >-
          jsonwebtoken.verify($TOKEN, $KEY, { algorithms: ["none"] })
